# ─────────────────────────────────────────────────────────────
# CiviTrack AI — complaint category taxonomy (M1)
#
# Maps the 150+ raw NYC 311 `complaint_type` values into a curated set of
# canonical, product-facing categories. Matching is CASE-INSENSITIVE on the
# trimmed complaint_type string. Anything not listed here falls back to
# `default_category`. Categories below `min_category_support` rows at train
# time are additionally collapsed into the default (see classification config).
#
# This file is the single source of truth for the label space. It is
# version-controlled and human-auditable by design — categories are a product
# decision, not an opaque clustering output. Bump `version` on any change.
# ─────────────────────────────────────────────────────────────
version: 1
default_category: Other

categories:
  Heat/Hot Water:
    - HEAT/HOT WATER
    - Non-Residential Heat
    - Boilers

  Noise:
    - Noise
    - Noise - Residential
    - Noise - Commercial
    - Noise - Street/Sidewalk
    - Noise - Helicopter
    - Noise - Vehicle
    - Noise - House of Worship
    - Noise - Park

  Illegal Parking:
